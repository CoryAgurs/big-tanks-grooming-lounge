  .veil{
    position:absolute;top:0;left:0;right:0;
    height:max(100svh,700px);
    background:linear-gradient(180deg,
      rgba(20,10,38,.10) 0%,
      rgba(20,10,38,.12) 28%,
      rgba(20,10,38,.78) 58%,
      var(--night) 80%);

  .content{position:relative;z-index:1;padding-top:calc(46svh)}

  h1{
    font-family:"Bebas Neue",sans-serif;
    font-weight:400;
    font-size:clamp(84px,27vw,128px);
    line-height:.82;
    letter-spacing:.005em;
    text-shadow:0 2px 24px rgba(20,10,38,.55);
  }
  h1 .sub{
    display:block;
    color:var(--teal);
    font-size:.42em;
    line-height:1;
    letter-spacing:.06em;
    margin-top:8px;
  }
  .addr{margin-top:14px;color:var(--mute);font-size:15px;line-height:1.5}
  .addr b{color:var(--text);font-weight:600}

  /* ---------- buttons ---------- */
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:24px}

  .pill{
    display:flex;align-items:center;gap:14px;
    min-height:60px;padding:0 20px;
    border-radius:999px;
    color:var(--text);text-decoration:none;
    background:var(--glass);
    border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background .15s ease;
  }
  .pill:active{transform:scale(.985);background:rgba(255,255,255,.2)}
  .pill:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .pill .ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .pill .txt{flex:1;min-width:0}
  .pill .t{display:block;font-weight:700;font-size:16.5px;line-height:1.2}
  .pill .sub{display:block;font-size:12.5px;color:inherit;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .pill.booksy{
    background:#fff;color:#2A1056;border-color:#fff;
    -webkit-backdrop-filter:none;backdrop-filter:none;
    min-height:66px;
  }
  .pill.booksy .t{font-size:18px}
  .pill.booksy:active{background:#EDE6FB}
  .pill.thecut{
    background:var(--teal);color:#05262A;border-color:var(--teal);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .pill.thecut:active{background:#38C6D0}

  .socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .soc{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    min-height:76px;border-radius:22px;
    color:var(--text);text-decoration:none;
    background:var(--glass);border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-weight:600;font-size:14px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background .15s ease;
  }
  .soc svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .soc:active{transform:scale(.97);background:rgba(255,255,255,.2)}
  .soc:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .save{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:18px;
    background:transparent;color:var(--mute);
    border:0;min-height:48px;
    font:600 14.5px "DM Sans",sans-serif;text-decoration:underline;text-underline-offset:4px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .save:hover{color:#fff}
  .save:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
  .save .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  footer{text-align:center;color:rgba(255,255,255,.4);font-size:12.5px;margin-top:10px}

  @media (prefers-reduced-motion: reduce){
    .photo{animation:none}
    .pill,.soc{transition:none}
  }
</style>
</head>

<main class="stage">

  <div class="veil"></div>

  <div class="content">
    <h1>Big Tank's<span class="sub">Grooming Lounge</span></h1>
    <p class="addr"><b data-bind="shop"></b><br><span data-bind="street"></span>, <span data-bind="cityLine"></span></p>

      </a>
      <a class="pill thecut" data-link="thecut" target="_blank" rel="noopener">

  var links = {
    booksy:     {href:C.booksy,    sub:"Pick a time on Booksy"},
    thecut:     {href:C.thecut,    sub:"Pick a time on The Cut"},
    directions: {href:mapsUrl,     sub:C.street},
    instagram:  {href:C.instagram, sub:C.instagramText},
    facebook:   {href:C.facebook,  sub:""},
    tiktok:     {href:C.tiktok,    sub:""},
    text:       {href:C.phone ? "sms:" + C.phone : "", sub:C.phone},
    tip:        {href:C.tip,       sub:C.tipText}
  };

  document.querySelectorAll('[data-link]').forEach(function(a){
    var l = links[a.dataset.link];
    if (!l || !l.href){ a.hidden = true; return; }
    a.href = l.href;
    var s = a.querySelector('.sub');
    if (s) s.textContent = l.sub || '';
  });

  document.querySelectorAll('[data-bind]').forEach(function(el){
    var v = C[el.dataset.bind];
    if (v) el.textContent = v; else el.hidden = true;
  });

  document.getElementById('yr').textContent = new Date().getFullYear();

  document.getElementById('save').addEventListener('click', function(){
    var lines = [
      'BEGIN:VCARD','VERSION:3.0',
      'N:;' + C.name + ';;;',
      'FN:' + C.name,
      'ORG:' + C.legalName,
      'TITLE:' + C.title,
      C.phone ? 'TEL;TYPE=CELL,VOICE:' + C.phone : '',
      C.email ? 'EMAIL;TYPE=INTERNET,WORK:' + C.email : '',
      'ADR;TYPE=WORK:;;' + C.street + ';Charlotte;NC;28208;USA',
      'URL:' + C.booksy,
      'X-SOCIALPROFILE;TYPE=instagram:' + C.instagram,
      'END:VCARD'
    ].filter(Boolean).join('\r\n');
    var blob = new Blob([lines], {type:'text/vcard;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Big-Tanks-Grooming-Lounge.vcf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  });
})();
</script>
</body>
</html>
